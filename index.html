<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Md Saif Ali | Developer Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"],
            display: ["Sora", "Inter", "ui-sans-serif", "system-ui"],
          },
          colors: {
            brand: {
              50: "#eef5ff",
              100: "#d8e8ff",
              200: "#b2d1ff",
              300: "#7ab0ff",
              400: "#428eff",
              500: "#1b6dff",
              600: "#0f50d6",
              700: "#0f42aa",
              800: "#123b87",
              900: "#17356f"
            }
          },
          boxShadow: {
            soft: "0 12px 40px rgba(5, 10, 28, 0.35)",
          },
          backgroundImage: {
            "hero-grid": "radial-gradient(circle at 20% -20%, rgba(59,130,246,0.22), transparent 40%), radial-gradient(circle at 85% 0%, rgba(168,85,247,0.14), transparent 35%)",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #030711;
      color: #e5e7eb;
      background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12), transparent 40%);
    }

    .glass {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .gradient-text {
      background: linear-gradient(135deg, #e2e8f0 0%, #60a5fa 55%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { motion } = window["framer-motion"];

    const navLinks = [
      { label: "Experience", href: "#experience" },
      { label: "Projects", href: "#projects" },
      { label: "Skills", href: "#skills" },
    ];

    const featuredProjects = [
      {
        title: "VAE Paper Reproduction",
        description:
          "Rebuilt Auto-Encoding Variational Bayes with optimized ELBO training and latent-space experiments in PyTorch.",
        tags: ["PyTorch", "Deep Learning", "Research"],
      },
      {
        title: "Scalable Education Bot",
        description:
          "Designed a backend automation platform serving 9,500+ students with queue-safe API integrations on AWS.",
        tags: ["AWS", "Automation", "Backend"],
      },
      {
        title: "Sign Language Detection",
        description:
          "Built a real-time sign-to-text pipeline combining CNN-based vision with sensor-augmented gesture modeling.",
        tags: ["Computer Vision", "IoT", "Python"],
      },
    ];

    const experience = [
      {
        role: "Research Intern (IoT)",
        company: "IIT Kharagpur",
        time: "May 2024 — Jun 2024",
        details:
          "Engineered optimization strategies for smart irrigation systems using sensor-driven control loops.",
      },
      {
        role: "Salesforce Developer Intern",
        company: "Smartinternz",
        time: "Dec 2023 — Feb 2024",
        details:
          "Developed modular Apex + LWC workflows and improved automation reliability for enterprise CRM operations.",
      },
      {
        role: "Blockchain Developer Intern",
        company: "IIIT Allahabad",
        time: "Jan 2023 — Feb 2023",
        details:
          "Implemented and analyzed smart contracts with a focus on protocol-level security and consensus tradeoffs.",
      },
    ];

    function App() {
      return (
        <main className="relative overflow-x-hidden">
          <div className="absolute inset-0 -z-10 bg-hero-grid" />

          <motion.nav
            initial={{ y: -50, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            transition={{ duration: 0.7, ease: "easeOut" }}
            className="fixed top-0 inset-x-0 z-50"
          >
            <div className="mx-auto mt-4 flex h-16 w-[min(1120px,92%)] items-center justify-between rounded-2xl px-5 glass shadow-soft">
              <a href="#" className="font-display text-lg md:text-xl font-bold tracking-tight">
                Md Saif <span className="text-brand-300">Ali</span>
              </a>
              <div className="hidden md:flex items-center gap-7 text-sm text-slate-300">
                {navLinks.map((link) => (
                  <a key={link.href} href={link.href} className="transition-colors hover:text-white">
                    {link.label}
                  </a>
                ))}
              </div>
              <a
                href="mailto:mdali.saif99@gmail.com"
                className="rounded-xl bg-brand-500/20 px-4 py-2 text-sm font-semibold text-brand-100 ring-1 ring-brand-300/40 transition-all hover:bg-brand-400 hover:text-slate-950"
              >
                Let&apos;s Talk
              </a>
            </div>
          </motion.nav>

          <section className="mx-auto w-[min(1120px,92%)] pt-36 pb-24 md:pt-44 md:pb-32">
            <div className="grid gap-14 lg:grid-cols-[1.25fr,0.95fr] lg:items-center">
              <motion.div
                initial={{ opacity: 0, y: 24 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.7, delay: 0.15 }}
                className="space-y-8"
              >
                <span className="inline-flex items-center rounded-full border border-brand-300/35 bg-brand-500/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-brand-200">
                  Open to AI/ML & SDE Roles
                </span>
                <h1 className="font-display text-4xl font-extrabold leading-tight sm:text-5xl md:text-6xl">
                  Building reliable software for <span className="gradient-text">intelligent systems</span>.
                </h1>
                <p className="max-w-2xl text-base text-slate-300 md:text-lg leading-relaxed">
                  I&apos;m Md Saif Ali, an IIT Bombay M.Tech (System & Control) student crafting high-performance products at the intersection of machine learning, cloud systems, and applied research.
                </p>
                <div className="flex flex-wrap items-center gap-4">
                  <a href="#projects" className="rounded-xl bg-white px-6 py-3 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-200">
                    View Projects
                  </a>
                  <a href="mailto:mdali.saif99@gmail.com" className="rounded-xl border border-slate-500/60 px-6 py-3 text-sm font-semibold text-slate-100 transition hover:border-slate-300 hover:bg-slate-800/40">
                    Contact Me
                  </a>
                </div>
              </motion.div>

              <motion.aside
                initial={{ opacity: 0, x: 24 }}
                animate={{ opacity: 1, x: 0 }}
                transition={{ duration: 0.7, delay: 0.25 }}
                className="glass rounded-3xl p-6 md:p-8 shadow-soft"
              >
                <p className="text-sm uppercase tracking-[0.22em] text-slate-400">Highlights</p>
                <div className="mt-6 grid gap-6 sm:grid-cols-2">
                  <Stat value="99.2%" label="GATE Percentile" />
                  <Stat value="0.8%" label="All India Rank" />
                  <Stat value="9.06" label="B.Tech CGPA" />
                  <Stat value="9500+" label="Users Served" />
                </div>
              </motion.aside>
            </div>
          </section>

          <section id="projects" className="mx-auto w-[min(1120px,92%)] py-16 md:py-20">
            <motion.div
              initial={{ opacity: 0, y: 18 }}
              whileInView={{ opacity: 1, y: 0 }}
              viewport={{ once: true, amount: 0.25 }}
              transition={{ duration: 0.6 }}
              className="mb-12"
            >
              <h2 className="font-display text-3xl md:text-4xl font-bold">Featured Projects</h2>
              <p className="mt-3 text-slate-400">Selected builds focused on performance, scale, and practical impact.</p>
            </motion.div>

            <div className="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
              {featuredProjects.map((project, index) => (
                <motion.article
                  key={project.title}
                  initial={{ opacity: 0, y: 24 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  viewport={{ once: true, amount: 0.2 }}
                  transition={{ duration: 0.45, delay: index * 0.12 }}
                  className="group glass rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1.5 hover:border-brand-300/50 hover:shadow-soft"
                >
                  <h3 className="text-xl font-semibold text-slate-100">{project.title}</h3>
                  <p className="mt-3 text-sm leading-relaxed text-slate-400">{project.description}</p>
                  <div className="mt-6 flex flex-wrap gap-2">
                    {project.tags.map((tag) => (
                      <span key={tag} className="rounded-md border border-slate-600/70 bg-slate-900/70 px-2.5 py-1 text-xs font-medium text-slate-200">
                        {tag}
                      </span>
                    ))}
                  </div>
                </motion.article>
              ))}
            </div>
          </section>

          <section id="experience" className="mx-auto w-[min(1120px,92%)] py-16 md:py-20">
            <h2 className="font-display text-3xl md:text-4xl font-bold">Experience</h2>
            <div className="mt-8 space-y-4">
              {experience.map((item, index) => (
                <motion.div
                  key={item.role}
                  initial={{ opacity: 0, y: 18 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  viewport={{ once: true, amount: 0.2 }}
                  transition={{ duration: 0.45, delay: index * 0.1 }}
                  className="glass rounded-2xl p-6 transition duration-300 hover:border-slate-300/35"
                >
                  <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                      <h3 className="text-lg font-semibold text-slate-100">{item.role}</h3>
                      <p className="text-sm text-brand-200">{item.company}</p>
                    </div>
                    <span className="text-xs text-slate-400">{item.time}</span>
                  </div>
                  <p className="mt-3 text-sm leading-relaxed text-slate-400">{item.details}</p>
                </motion.div>
              ))}
            </div>
          </section>

          <section id="skills" className="mx-auto w-[min(1120px,92%)] py-16 md:py-20">
            <div className="glass rounded-3xl p-7 md:p-10">
              <h2 className="font-display text-3xl md:text-4xl font-bold">Core Skills</h2>
              <div className="mt-7 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                {["Python", "C++", "PyTorch", "TensorFlow", "AWS", "IoT Systems", "Docker", "REST APIs", "Optimization"].map((skill) => (
                  <div key={skill} className="rounded-xl border border-slate-600/70 bg-slate-900/45 px-4 py-3 text-sm font-medium text-slate-200 transition hover:border-brand-300/45 hover:text-white">
                    {skill}
                  </div>
                ))}
              </div>
            </div>
          </section>

          <footer className="border-t border-slate-700/40 py-12 text-center text-sm text-slate-500">
            © 2026 Md Saif Ali · Designed with a modern minimal system.
          </footer>
        </main>
      );
    }

    function Stat({ value, label }) {
      return (
        <div className="rounded-2xl border border-slate-700/70 bg-slate-900/65 p-4">
          <p className="text-2xl font-bold text-slate-100">{value}</p>
          <p className="mt-1 text-xs uppercase tracking-[0.14em] text-slate-400">{label}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
